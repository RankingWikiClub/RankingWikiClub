<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RankingWikiClub - Clubes</title>
  <link rel="icon" type="image/png" href="./assets/favicon-rankingwikiclub.png?v=20260730-3">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png?v=20260730-3">
  <meta property="og:image" content="./assets/logo-rankingwikiclub-oficial.png?v=20260730-7">
  <link rel="stylesheet" href="./css/style.css?v=20260711c">

<style>
.contador-resultados-clubes {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  width: fit-content;
  min-height: 38px;
  margin: 12px 0 16px;
  padding: 8px 14px;
  border: 1px solid rgba(15, 76, 170, 0.22);
  border-radius: 10px;
  background: #f2f7ff;
  color: #123b78;
  font-size: 0.95rem;
  font-weight: 700;
  line-height: 1.2;
}
.contador-resultados-clubes.sem-resultados {
  background: #fff7e8;
  color: #7b4a00;
}
</style>

  <script src="js/normalizar-paises-portugues.js?v=1"></script>
</head>
<body>
<header class="topo">
  <nav class="menu">
    <a href="./index.html" class="logo-menu" aria-label="RankingWikiClub Início"><img class="logo-rankingwikiclub-topo" src="./assets/logo-rankingwikiclub-oficial.png?v=20260730-7" alt="RankingWikiClub Banco de Dados"></a>
    <a href="./index.html">Início</a>
    <a href="./clubes.html">Clubes</a>
    <a href="./selecoes.html">Seleções</a>
    <a href="./competicoes.html">Competições</a>
    <a href="./estatisticas.html">Estatísticas</a>
    <a href="./cadastros.html">Inserir</a>
    <a href="./editor.html">Editor</a>
  </nav>
</header>
<div class="campo-pesquisa-principal pesquisa-topo">
  <label for="pesquisaClubes">Pesquisar clubes</label>
  <input type="search" id="pesquisaClubes" placeholder="Digite o nome, país, estado ou cidade...">
</div>

<main class="pagina">
  <h2>Clubes</h2>

  <div class="filtros">
    <div class="grupo">
      <label>Abrangência</label>
      <select id="filtroAbrangenciaClubes">
        <option value="todos">Todos os clubes</option>
        <option value="continentes">Continentes</option>
      </select>
    </div>

    <div id="grupoFiltroContinenteClubes" class="grupo oculto">
      <label>Continente</label>
      <select id="filtroContinenteClubes">
        <option value="">Selecione um continente</option>
      </select>
    </div>

    <div id="grupoFiltroPaisClubes" class="grupo oculto">
      <label>País</label>
      <select id="filtroPaisClubes">
        <option value="">Selecione um país</option>
      </select>
    </div>

    <div id="grupoFiltroEstadoClubes" class="grupo oculto">
      <label>Filtrar por estado</label>
      <select id="filtroEstadoClubes">
        <option value="">Todos os estados</option>
      </select>
    </div>
  </div>
  
    <div id="contadorResultadosClubes" class="contador-resultados-clubes" aria-live="polite">
      0 times encontrados
    </div>
<div id="listaClubes" class="cards"></div>
  <div id="detalhesClube" class="detalhes" style="display:none;">
    <h2 id="tituloClube"></h2>
    <div id="infoClube"></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabase.js"></script>
<script src="./js/storage.js"></script>
<script src="./js/dados.js?v=20260712a"></script>
<script src="./js/detalhes.js?v=20260719-atalho-titulos"></script>
<script src="./js/clubes.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/login-edicao-fix.js?v=1"></script>
<script src="./js/rankingwikiclub-supabase-fix.js?v=3"></script>
  <script src="js/sincronizar-listas-paises.js?v=20260711"></script>
  <script src="./js/titulos-supabase-fix.js?v=20260718-final"></script>
</body>
</html>
