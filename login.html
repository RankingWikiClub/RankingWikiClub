<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RankingWikiClub - Login</title>
  <link rel="stylesheet" href="./css/style.css?v=20260711c">
  <style>
    .login-box{max-width:420px;margin:40px auto;background:#fff;border-left:8px solid #009b4e;border-radius:18px;box-shadow:0 8px 22px rgba(0,0,0,.12);padding:24px}
    .login-box h2{margin-top:0;text-align:center;color:#00317c}.login-box input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #c8d8d0;border-radius:10px;margin:8px 0 14px;font-size:16px}.login-box button{width:100%;padding:14px;border:0;border-radius:10px;background:#009b4e;color:#fff;font-weight:700;font-size:17px}.erro-login{color:#b00020;text-align:center;margin-top:12px}.ajuda-login{font-size:14px;color:#555;line-height:1.4;text-align:center}
  </style>
  <script src="js/normalizar-paises-portugues.js?v=1"></script>
</head>
<body>
<header class="topo">
  <nav class="menu">
    <a href="./index.html" class="logo-menu" aria-label="RankingWikiClub Início"><img class="logo-rankingwikiclub-topo" src="./assets/logo-rankingwikiclub-novo.png?v=20260730-2" alt="RankingWikiClub Banco de Dados"></a>
    <a href="./index.html">Início</a>
    <a href="./clubes.html">Clubes</a>
    <a href="./selecoes.html">Seleções</a>
    <a href="./competicoes.html">Competições</a>
    <a href="./estatisticas.html">Estatísticas</a>
  </nav>
</header>
<main class="pagina">
  <div class="login-box">
    <h2>Entrar no RankingWikiClub</h2>
    <form id="formLogin">
      <label>E-mail</label>
      <input type="email" id="emailLogin" placeholder="Seu e-mail" required>
      <label>Senha</label>
      <input type="password" id="senhaLogin" placeholder="Sua senha" required>
      <button type="submit">Entrar</button>
      <p id="erroLogin" class="erro-login"></p>
    </form>
    <p class="ajuda-login">Use o e-mail e a senha criados em Authentication → Users no Supabase.</p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabase.js"></script>
<script src="./js/storage.js"></script>
<script src="./js/auth.js"></script>
<script>
document.getElementById('formLogin').addEventListener('submit', async (e) => {
  e.preventDefault();
  const erro = document.getElementById('erroLogin');
  erro.textContent = '';
  try {
    await loginFutpedia(
      document.getElementById('emailLogin').value.trim(),
      document.getElementById('senhaLogin').value
    );
    const params = new URLSearchParams(location.search);
    window.location.href = params.get('redirect') || './index.html';
  } catch (err) {
    erro.textContent = err.message || 'Não foi possível entrar.';
  }
});
</script>
  <script src="js/sincronizar-listas-paises.js?v=20260711"></script>
  <script src="./js/titulos-supabase-fix.js?v=20260718-final"></script>
</body>
</html>
